name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write # OIDC authentication to the MCP Registry
jobs:
  release:
    runs-on: arc-runner-set-vbox-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The registry takes one mcpb artifact per version with no platform
      # field, so every (os, arch) binary ships in a single bundle.
      - name: Build MCP bundle
        id: mcpb
        run: |
          out=$(BIN_DIR=dist scripts/build-mcpb.sh "${GITHUB_REF_NAME#v}" dist-mcpb)
          echo "bundle=$(printf '%s\n' "$out" | head -1)" >> "$GITHUB_OUTPUT"
          echo "sha=$(printf '%s\n' "$out" | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Attach bundle to release
        run: python3 scripts/upload-release-asset.py "$GITHUB_REF_NAME" "${{ steps.mcpb.outputs.bundle }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The bundle URL and its hash are only knowable after the release exists,
      # so the committed server.json carries a placeholder hash and CI stamps
      # the real one in. Published versions are immutable — this must be right.
      - name: Stamp bundle coordinates into server.json
        run: |
          python3 - "${GITHUB_REF_NAME#v}" "${{ steps.mcpb.outputs.sha }}" <<'PY'
          import json, sys

          version, sha = sys.argv[1], sys.argv[2]
          with open("server.json") as f:
              doc = json.load(f)

          doc["version"] = version
          pkg, = doc["packages"]
          pkg["version"] = version
          pkg["fileSha256"] = sha
          pkg["identifier"] = (
              "https://github.com/bryanjbelanger/desktop-hypervisor-mcp"
              f"/releases/download/v{version}/desktop-hypervisor-mcp-{version}.mcpb"
          )

          with open("server.json", "w") as f:
              json.dump(doc, f, indent=2)
              f.write("\n")
          PY

      - name: Install mcp-publisher
        run: |
          python3 - <<'PY'
          import platform, tarfile, urllib.request

          arch = {"x86_64": "amd64", "aarch64": "arm64"}.get(platform.machine(), platform.machine())
          url = (
              "https://github.com/modelcontextprotocol/registry/releases/latest/download"
              f"/mcp-publisher_{platform.system().lower()}_{arch}.tar.gz"
          )
          urllib.request.urlretrieve(url, "mcp-publisher.tar.gz")
          with tarfile.open("mcp-publisher.tar.gz") as tar:
              tar.extract("mcp-publisher", ".", filter="data")
          PY
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher validate
          ./mcp-publisher publish
